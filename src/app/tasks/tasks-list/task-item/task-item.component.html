<article
  [class]="{
    'status-open': task().status === 'OPEN',
    'status-in-progress': task().status === 'IN_PROGRESS',
    'status-done': task().status === 'DONE',
  }"
>
  <header>
    <h3>{{ task().title }}</h3>
    <p>{{ taskStatus() }}</p>
  </header>
  <p>{{ task().description }}</p>
  <form (ngSubmit)="onChangeTaskStatus(task().id, status.value)">
    <select #status>
      <!-- <option value="open" [selected]="task().status === 'OPEN'">Open</option>
      <option value="in-progress" [selected]="task().status === 'IN_PROGRESS'">
        In-Progress
      </option>
      <option value="done" [selected]="task().status === 'DONE'">
        Completed
      </option> -->

      @for (option of taskStatusOptions; track option.value) {
        <option
          [value]="option.value"
          /* property binding, Angular evaluates the expression and assigns the resulting Boolean value to the DOM property. selected is built-in html property, You don't have to declare every HTML property in TypeScript.*/
          [selected]="task().status === option.taskStatus"
        >
          {{ option.text }}
        </option>
      }
    </select>
    <p>
      <button>Change Status</button>
    </p>
  </form>
</article>
